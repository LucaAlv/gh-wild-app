    "de": "Seit 1990 begrüßen drei Generationen der Familie Wild Gäste in unserem über 300 Jahre alten Fachwerkhaus. Was einst ein traditionsreicher Bauernhof war, haben Sonja und Lothar Wild mit viel Hingabe zum Gästehaus umgebaut. Jedes Zimmer fügt sich in die Geschichte des Hauses ein und bleibt dabei einzigartig. Virginia und Lee Ann Wild heißen Sie am Empfang und beim Frühstück herzlich willkommen – und unsere kleine Sydney sorgt mit einem fröhlichen Wuff dafür, dass sich alle schnell zuhause fühlen.\n\nWir freuen uns auf Sie.\nIhre Familie Wild",
    "en": "Since 1990, three generations of the Wild family have welcomed guests to our half-timbered house, more than 300 years old. Sonja and Lothar Wild lovingly transformed the former farmhouse into today’s guesthouse. Every room belongs to the story of the building while remaining unique. Virginia and Lee Ann Wild welcome you at reception and breakfast—and little Sydney’s cheerful bark helps everyone feel at home.\n\nWe look forward to welcoming you.\nThe Wild family"
