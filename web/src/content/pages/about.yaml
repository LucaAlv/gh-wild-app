  "body": {
    "de": "Seit 1990 begrüßen drei Generationen der Familie Wild Gäste in unserem über 300 Jahre alten Fachwerkhaus. Was einst ein Bauernhof war, haben Sonja und Lothar Wild zum Gästehaus umgebaut. Jedes Zimmer fügt sich in die Geschichte des Hauses ein und bleibt dabei einzigartig.\n\nVirginia und Lee Ann Wild empfangen Sie am Empfang und beim Frühstück. Unsere Hündin Sydney begrüßt Sie meist als Erste.\n\nWir freuen uns auf Sie.\nIhre Familie Wild",
    "en": "Since 1990, three generations of the Wild family have welcomed guests to our half-timbered house, more than 300 years old. Sonja and Lothar Wild converted the former farmhouse into today’s guesthouse. Every room belongs to the story of the building while remaining unique.\n\nVirginia and Lee Ann Wild look after reception and breakfast. Our dog Sydney usually greets you first.\n\nWe look forward to welcoming you.\nThe Wild family"
  },
