    "de": "Entwurf – Stand August 2026\n\n1. Verantwortlicher\nGästehaus Wild, Lee Ann Wild, Jahnstraße 77, 90522 Oberasbach, Telefon 0911 996910, info@gaestehaus-wild.com.\n\n2. Bereitstellung der Website\nBeim Aufruf verarbeitet unser Hosting-Dienstleister Vercel technisch erforderliche Verbindungsdaten, insbesondere IP-Adresse, Zeitpunkt und angeforderte Seite, um die Website sicher bereitzustellen. Rechtsgrundlage ist Art. 6 Abs. 1 lit. f DSGVO.\n\n3. Anfrageformular\nWenn Sie das Anfrageformular nutzen, verarbeiten wir Name, Kontaktdaten, Reisedaten, Zimmerwunsch, Personenzahl und Ihre Nachricht zur Bearbeitung der Anfrage sowie zur Vorbereitung eines Beherbergungsvertrags (Art. 6 Abs. 1 lit. b DSGVO). Die Angaben werden über Vercel verarbeitet und über den Versanddienst Resend an uns übermittelt. Resend verarbeitet Daten möglicherweise in den USA; die hierfür eingesetzten Garantien müssen vor Veröffentlichung rechtlich geprüft werden.\n\n4. Schutz vor Missbrauch\nDas Formular wird mit Cloudflare Turnstile gegen automatisierte Eingaben geschützt. Dabei können technisch erforderliche Daten an Cloudflare übermittelt werden. Rechtsgrundlage ist unser berechtigtes Interesse am sicheren Betrieb nach Art. 6 Abs. 1 lit. f DSGVO.\n\n5. Lokale Aufenthaltsdaten\nWenn Sie unter „Mein Aufenthalt“ Reisedaten speichern, verbleiben diese ausschließlich im lokalen Speicher Ihres Geräts. Die Daten werden nicht an uns übertragen und 14 Tage nach Abreise automatisch entfernt. Eine Kalenderdatei wird vollständig auf Ihrem Gerät erzeugt.\n\n6. Redaktionssystem\nGitHub und Sveltia CMS werden ausschließlich von berechtigten Redakteurinnen zur Pflege der Website genutzt. Besucherinnen und Besucher sind davon nicht betroffen.\n\n7. Cookies und Analyse\nDiese Website verwendet keine Analyse-, Werbe- oder Trackingdienste. Es werden keine einwilligungspflichtigen Cookies gesetzt.\n\n8. Kontakt, Empfänger und Speicherdauer\nAnfragen erhalten wir über Microsoft 365. Wir löschen personenbezogene Daten, sobald sie für den jeweiligen Zweck nicht mehr erforderlich sind und keine gesetzlichen Aufbewahrungspflichten entgegenstehen.\n\n9. Ihre Rechte\nSie haben insbesondere Rechte auf Auskunft, Berichtigung, Löschung, Einschränkung, Datenübertragbarkeit und Widerspruch. Beschwerden können Sie an das Bayerische Landesamt für Datenschutzaufsicht, Promenade 18, 91522 Ansbach richten.\n\nDieser Entwurf muss vor Veröffentlichung rechtlich geprüft und um die vollständigen Anbieterangaben, Auftragsverarbeitungs- und Drittlandinformationen ergänzt werden.",
    "en": "Draft – August 2026\n\nThis English text is a non-binding convenience translation; the German version governs.\n\n1. Controller\nGästehaus Wild, Lee Ann Wild, Jahnstraße 77, 90522 Oberasbach, Germany, +49 911 996910, info@gaestehaus-wild.com.\n\n2. Website delivery\nOur hosting provider Vercel processes technically necessary connection data, especially your IP address, access time and requested page, to deliver the site securely. The legal basis is Art. 6(1)(f) GDPR.\n\n3. Inquiry form\nIf you use the inquiry form, we process your name, contact details, travel dates, room preference, number of guests and message to answer your inquiry and prepare an accommodation contract (Art. 6(1)(b) GDPR). Data is processed through Vercel and delivered to us using Resend. Resend may process data in the United States; the safeguards must be legally reviewed before publication.\n\n4. Abuse prevention\nCloudflare Turnstile protects the form from automated submissions and may receive technically necessary data. The legal basis is our legitimate interest in secure operation under Art. 6(1)(f) GDPR.\n\n5. Local stay details\nTravel dates saved under “My stay” remain in your device’s local storage. They are not sent to us and are removed automatically 14 days after departure. Calendar files are generated entirely on your device.\n\n6. Editorial system\nGitHub and Sveltia CMS are used only by authorised editors. Website visitors are not affected.\n\n7. Cookies and analytics\nThis site uses no analytics, advertising or tracking services and sets no cookies requiring consent.\n\n8. Contact, recipients and retention\nWe receive inquiries through Microsoft 365. Personal data is deleted when it is no longer required, unless statutory retention obligations apply.\n\n9. Your rights\nYou have rights including access, rectification, erasure, restriction, portability and objection. Complaints may be addressed to the Bavarian Data Protection Authority (BayLDA), Promenade 18, 91522 Ansbach, Germany.\n\nThis draft requires legal review and complete provider, processor and international-transfer details before publication."
