name: GaestehausWild
options:
  bundleIdPrefix: com.gaestehauswild
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: de
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
targets:
  GaestehausWild:
    type: application
    platform: iOS
    sources:
      - path: GaestehausWild
        excludes:
          - Resources/PrivacyInfo.xcprivacy
      - path: GaestehausWild/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaestehauswild.app
        PRODUCT_NAME: GaestehausWild
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Gästehaus Wild"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.travel
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
    scheme:
      testTargets:
        - GaestehausWildTests
  GaestehausWildTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GaestehausWildTests
      - path: GaestehausWild/Model
      - path: GaestehausWild/Localization
      - path: GaestehausWild/Content
      - path: GaestehausWild/Support/QRCode.swift
      - path: GaestehausWild/Support/StayStorage.swift
      - path: GaestehausWild/Support/StayStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaestehauswild.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
